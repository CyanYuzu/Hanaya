# 内容仓 main 更新 -> repository_dispatch -> 拉取固定内容 commit -> 构建 -> 同步到 VPS。
# 发布目标 deploy@154.36.184.57:/srv/hanaya/www/，由现有 Nginx vhost 提供服务。
# 必需 Secrets：CONTENT_REPO_TOKEN（仅 Hanaya-Storages Contents: read）、VPS_SSH_KEY。

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - ".agents/**"
      - "tests/**"
      - "*.md"
      - "LICENSE"
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
    inputs:
      content_ref:
        description: "用于回滚的内容仓 commit SHA；留空则使用 main"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTENT_REPOSITORY: CyanYuzu/Hanaya-Storages
  VPS_HOST: 154.36.184.57
  VPS_USER: deploy
  VPS_TARGET: /srv/hanaya/www/

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      CONTENT_DIR: .content-src

    steps:
      - name: Resolve content ref
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            repository_dispatch)
              ref="$PAYLOAD_SHA"
              if [[ ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::repository_dispatch did not include a valid content commit SHA"
                exit 1
              fi
              ;;
            workflow_dispatch)
              ref="${INPUT_REF:-main}"
              if [[ "$ref" != "main" && ! "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::content_ref must be main or a full 40-character commit SHA"
                exit 1
              fi
              ;;
            *)
              ref="main"
              ;;
          esac
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout code repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check private content token
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CONTENT_REPO_TOKEN:-}" ]; then
            echo "::error::Add CONTENT_REPO_TOKEN with read access to CyanYuzu/Hanaya-Storages."
            exit 1
          fi

      - name: Checkout private content repository
        uses: actions/checkout@v7.0.1
        with:
          repository: CyanYuzu/Hanaya-Storages
          ref: ${{ steps.target.outputs.ref }}
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Record content commit
        id: content
        run: echo "sha=$(git -C .content-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # pnpm build 首步运行 content:sync，从 .content-src 物化当前内容，再构建静态站。
      - name: Build site
        run: pnpm build

      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Add VPS_SSH_KEY to the Hanaya repository Actions secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy dist to VPS
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "${VPS_USER}@${VPS_HOST}:${VPS_TARGET}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Summarize deployment
        if: always()
        env:
          CONTENT_SHA: ${{ steps.content.outputs.sha }}
        run: |
          {
            echo "### Shirone deploy"
            echo ""
            echo "- 内容仓：\`${CONTENT_REPOSITORY}\`"
            echo "- 内容 commit：\`${CONTENT_SHA:-not checked out}\`"
            echo "- VPS target：\`${VPS_USER}@${VPS_HOST}:${VPS_TARGET}\`"
          } >> "$GITHUB_STEP_SUMMARY"
