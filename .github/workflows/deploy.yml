# push 到 main 后：GitHub Actions 构建，再把 dist/ 同步到 VPS。
#
# 部署目标：deploy@154.36.184.57:/srv/hanaya/www/
# 由 nginx 站点 /www/server/panel/vhost/nginx/hanaya.cyanyuzu.work.conf 提供静态服务。
#
# 首次使用需要配置仓库 Secret：
#   Settings > Secrets and variables > Actions > New repository secret
#   名称：VPS_SSH_KEY   值：服务器上 /home/deploy/.ssh/id_ed25519_gha 的私钥内容
#
# 只改了文档/测试不会触发部署（见 paths-ignore）。

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - ".agents/**"
      - "tests/**"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

# 同一时间只跑一个部署；新提交会取消进行中的旧构建。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  VPS_HOST: 154.36.184.57
  VPS_USER: deploy
  VPS_TARGET: /srv/hanaya/www/

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 含 content:sync、图标生成、说说缩略图、字体子集化、astro build、
      # Pagefind 索引与字体校验 —— 与本地发布流程完全一致。
      - name: Build
        run: pnpm build

      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::缺少仓库 Secret VPS_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # --delete 清掉上一次构建残留的旧文件；dist/ 是纯构建产物，可安全整体替换。
      - name: Deploy dist to VPS
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "${VPS_USER}@${VPS_HOST}:${VPS_TARGET}"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
